name: pdf-report

# Build the PDF reliability report (scripts/make_pdf_report.py) from the stored results, FINDINGS.md and references,
# and keep it as the artifact "reliability-report". Nothing is pushed from here: to update the committed copy,
# download the artifact and commit it (README.md, "The PDF report"). The step "Is the committed PDF current?" says
# whether reports/simplydata_reliability_report.pdf already equals the new build (the same files give the same PDF).
on:
  pull_request:
    paths:
      - "results/**"
      - "references/**"
      - "FINDINGS.md"
      - "README.md"
      - "requirements.txt"
      - "scripts/make_pdf_report.py"
      - ".github/workflows/pdf-report.yml"
  push:
    branches: [main]
    paths:
      - "results/**"
      - "references/**"
      - "FINDINGS.md"
      - "README.md"
      - "requirements.txt"
      - "scripts/make_pdf_report.py"
      - ".github/workflows/pdf-report.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # simplydata (for the list of its words, section 6) at the commit requirements.txt pins, without its R part;
      # ReportLab is pure Python, and matplotlib brings the DejaVu fonts the PDF embeds
      - name: Install
        run: |
          python -m pip install --upgrade pip
          sd=$(grep -E '^simplydata' requirements.txt | sed -E 's/^simplydata\[[a-z,]*\]/simplydata/')
          python -m pip install "$sd" "matplotlib==3.11.2" "reportlab==4.4.10"

      - name: Build the PDF
        run: python scripts/make_pdf_report.py --out build/simplydata_reliability_report.pdf

      - name: Is the committed PDF current?
        run: |
          if cmp -s build/simplydata_reliability_report.pdf reports/simplydata_reliability_report.pdf; then
            echo "The committed reports/simplydata_reliability_report.pdf is current."
          else
            echo "::notice::reports/simplydata_reliability_report.pdf differs from this build: download the artifact reliability-report and commit it."
          fi

      - name: Keep the PDF
        uses: actions/upload-artifact@v4
        with:
          name: reliability-report
          path: build/simplydata_reliability_report.pdf
